<!doctype html>
<html lang="en">
  <head>
    <base href="/shockfx/" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShockBox · ShockFX body tracking</title>
    <style>
      /* An OBS browser source renders this page at the size it was given: a 1×1 or small source is
         the intended use. Nothing here needs to be visible, but the status line is legible when
         the page is opened in a tab for setup. */
      html,
      body {
        margin: 0;
        background: #000;
        color: #d8dde6;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #cam {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        opacity: 0.35;
      }
      #mask {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.5;
        image-rendering: pixelated;
      }
      #status {
        position: fixed;
        left: 6px;
        bottom: 6px;
        right: 6px;
        padding: 4px 6px;
        background: rgba(0, 0, 0, 0.72);
        border-radius: 4px;
        white-space: pre-wrap;
        font-size: 11px;
        line-height: 1.35;
      }
      #status[data-tone='ok'] {
        color: #9be7a4;
      }
      #status[data-tone='warn'] {
        color: #f2c14e;
      }
      #status[data-tone='bad'] {
        color: #ff8b8b;
      }
      body[data-clean='true'] #status,
      body[data-clean='true'] #cam,
      body[data-clean='true'] #mask {
        display: none;
      }
      /* Embed mode (?embed=1): this page inside the pane. It has no camera of its own, so the mask
         the OBS body source publishes is the whole picture. Start and Stop live in the pane. */
      body[data-embed='true'] #cam,
      body[data-embed='true'] #controls {
        display: none;
      }
      body[data-embed='true'] #mask {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.85;
        background: #05070a;
      }
      body[data-embed='true'] #status {
        left: 4px;
        right: 4px;
        bottom: 4px;
        padding: 3px 5px;
        font-size: 10px;
      }
      #controls {
        position: fixed;
        top: 6px;
        left: 6px;
        display: flex;
        gap: 6px;
      }
      body[data-clean='true'] #controls {
        display: none;
      }
      button {
        font: inherit;
        padding: 3px 8px;
        border-radius: 4px;
        border: 1px solid #3a4354;
        background: #141a24;
        color: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body data-clean="false">
    <video id="cam" autoplay muted playsinline></video>
    <canvas id="mask"></canvas>
    <div id="controls">
      <button type="button" data-act="start">Start camera</button>
      <button type="button" data-act="stop">Stop</button>
    </div>
    <div id="status" data-tone="idle">body page: not started</div>
    <script type="module" src="js/body/main.js"></script>
  </body>
</html>
