<!doctype html>
<html lang="en">
  <head>
    <base href="/shockfx/" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShockBox · ShockFX</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* OBS renders this page at exactly the browser source size and needs a transparent
         background: only the effects (and, in debug mode, the camera) are opaque. */
      html,
      body {
        background: transparent;
      }
    </style>
  </head>
  <body data-tracking="false" data-synthetic="false" data-isolated="unknown">
    <div id="stage">
      <canvas id="cam"></canvas>
      <canvas id="fx"></canvas>
    </div>
    <div id="badge" hidden></div>
    <div id="banner" hidden></div>
    <div id="controls">
      <button type="button" data-act="start" data-state="off">Start camera</button>
      <button type="button" data-act="synthetic">Synthetic</button>
      <button type="button" data-act="stop">Stop</button>
    </div>
    <script type="module">
      // Load the bundle with the build the server is serving. The HTML itself is `no-store`, so a
      // reload asks for a fresh build and the entry module URL changes with it; a document OBS
      // keeps alive keeps its old `?v=` and reports that old build on /ack, which is how a stale
      // source is caught instead of looking healthy.
      const res = await fetch('/api/handfx/build', { cache: 'no-store' }).catch(() => null);
      const build = res && res.ok ? String((await res.json()).build || '') : '';
      await import(`./js/overlay/main.js${build ? `?v=${encodeURIComponent(build)}` : ''}`);
    </script>
  </body>
</html>
