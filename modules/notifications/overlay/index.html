<!doctype html>
<html lang="en" data-ratio="16:9">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShockBox · Notifications</title>
    <link rel="stylesheet" href="/notify/style.css" />
    <style>
      /* OBS renders this page at whatever size the browser source is given, so the viewport is
         never pinned to a phone canvas. No body background: the surface stays transparent and
         only the toasts show. The stage centres itself for a 9:16 ratio. */
      body {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/notify/app.js"></script>
  </body>
</html>
