<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mod/wall/engine/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED wall</title>
<style>
  /* A full surface, whatever the source is: the engine sizes the canvas element from the ratio
     (see engine.js `_sizeCanvas`), so nothing here names a pixel size or an aspect. */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #wall { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #diag, #bench {
    position: absolute; left: 8px; margin: 0; padding: 4px 6px;
    font: 11px/1.35 ui-monospace, monospace; color: #8ef; background: rgba(0,0,0,.55);
    white-space: pre; pointer-events: none;
  }
  #diag { top: 8px; }
  #bench { bottom: 8px; }
</style>
</head>
<body>
<canvas id="wall"></canvas>
<pre id="diag" hidden></pre>
<pre id="bench" hidden></pre>
<script>
  // One page, two surfaces. `/wall/portrait` is an OBS source at 720x1280: it pins 9:16 and the
  // document cannot move it. `/wall/render` follows the `ratio` setting on every state frame, so
  // the operator can switch 16:9 ↔ 9:16 without a reload (boot.js → engine.setRatio).
  (function () {
    var portrait = /^\/wall\/portrait\/?$/.test(location.pathname);
    window.LEDWALL_PAGE = portrait
      ? { ratio: '9:16', view: 'portrait', forceRatio: true }
      : { ratio: '16:9', view: 'landscape' };
  })();
</script>
<script src="config.js"></script>
<script src="sim.js"></script>
<script src="grade.js"></script>
<script src="presets/presets.js"></script>
<script src="engine.js"></script>
<script src="boot.js"></script>
</body>
</html>
