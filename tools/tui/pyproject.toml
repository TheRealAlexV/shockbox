[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shockbox-tui"
version = "0.1.0"
description = "Windows TUI controller for ShockBox: supervises server.mjs, edits settings, reads /health"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # The UI half. Core modules (supervisor, control, settings, apiclient, paths, logtail) import
  # nothing outside the standard library, so the supervisor works on a box where Textual is broken.
  "textual>=8,<9",
]

[project.scripts]
shockbox = "shockbox_tui.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2", "pytest-randomly>=3"]

[tool.hatch.build.targets.wheel]
packages = ["shockbox_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Tests start real subprocesses; a hung one must fail the suite rather than hang CI.
timeout = 300
