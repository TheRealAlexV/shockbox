[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shockbox-tui"
version = "0.1.0"
description = "Core for the ShockBox supervisor: owns server.mjs, restarts it, edits settings, reads /health"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2", "pytest-randomly>=3"]

[tool.hatch.build.targets.wheel]
packages = ["shockbox_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Tests start real subprocesses; a hung one must fail the suite rather than hang CI.
timeout = 300
