name: test

# Every gate runs on a push, without the OBS rig. The project has zero npm dependencies: no
# `npm install` step exists on purpose — a test that needs a package is a defect, not an install.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: fast gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The browser tests (test/*.mjs) find Chrome as `process.env.CHROME` (handfx-visual.mjs uses
      # `CHROME_PATH`) or by probing `/usr/bin/google-chrome`, `/usr/bin/chromium`,
      # `/usr/bin/chromium-browser`. setup-chrome puts a real google-chrome binary on the runner;
      # also expose it under the exact probed names so no env var is required.
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          install-dependencies: true

      - name: Expose chrome under the names the tests probe
        run: |
          set -eu
          bin="${{ steps.setup-chrome.outputs.chrome-path }}"
          echo "setup-chrome -> $bin"
          sudo ln -sf "$bin" /usr/bin/google-chrome
          sudo ln -sf "$bin" /usr/bin/chromium
          sudo ln -sf "$bin" /usr/bin/chromium-browser
          echo "CHROME=$bin" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: npm test
        run: npm test

  handfx-visual:
    name: handfx visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          install-dependencies: true

      - name: Expose chrome under the names the tests probe
        run: |
          set -eu
          bin="${{ steps.setup-chrome.outputs.chrome-path }}"
          echo "setup-chrome -> $bin"
          sudo ln -sf "$bin" /usr/bin/google-chrome
          sudo ln -sf "$bin" /usr/bin/chromium
          sudo ln -sf "$bin" /usr/bin/chromium-browser
          echo "CHROME=$bin" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      # Strict: the suite is deterministic on this stack (SwiftShader, 7 consecutive strict runs green).
      # The last fringe was a real defect — `disco`'s facets were sized in uv while placed in field
      # space, so on a slow frame the light covered a hairline and the effect vanished.
      - name: npm run test:handfx-visual:strict (SwiftShader via --use-angle=swiftshader)
        timeout-minutes: 15
        run: npm run test:handfx-visual:strict
